[project]
name = "bond-rp"
version = "1.0.0"
description = "Paper-validated Treasury forecasts and fully funded monthly bond timing"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.3",
    "statsmodels==0.14.6",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "xlrd==2.0.2",
    "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
report = ["matplotlib==3.11.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bond_rp"]
