[project]
name = "bond-rp"
version = "0.1.0"
description = "Bond Risk Premium Predictability: Multi-Factor OOS Analysis"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.optional-dependencies]
report = ["matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bond_rp"]
